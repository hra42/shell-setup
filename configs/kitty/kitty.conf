# ─────────────────────────────────────────────
#  kitty.conf  –  Catppuccin Mocha + Monaspace
# ─────────────────────────────────────────────

# ── Fonts ─────────────────────────────────────
font_family      MonaspaceNeon Nerd Font
bold_font        MonaspaceXenon Nerd Font
italic_font      MonaspaceRadon Nerd Font
bold_italic_font MonaspaceKrypton Nerd Font

font_size 13.0

# Monaspace OpenType features
# calt = Texture Healing, liga = ligatures
font_features MonaspaceNeon-Regular     +calt +liga
font_features MonaspaceNeon-Bold        +calt +liga
font_features MonaspaceXenon-Regular    +calt +liga
font_features MonaspaceXenon-Bold       +calt +liga
font_features MonaspaceRadon-Regular    +calt +liga
font_features MonaspaceRadon-Bold       +calt +liga
font_features MonaspaceKrypton-Regular  +calt +liga
font_features MonaspaceKrypton-Bold     +calt +liga

# ── Window ────────────────────────────────────
window_padding_width  16

# Background transparency + blur (macOS & some compositors)
background_opacity    0.7
background_blur       20

# ── Shell integration ─────────────────────────
# Kitty has built-in shell integration; enable cursor reporting and title
shell_integration    enabled
# sudo integration requires the kitty SSH kitten, see below

# ── Behaviour ─────────────────────────────────
# Don't ask before closing
confirm_os_window_close 0

# Paste protection is off in Ghostty – match that behaviour
paste_actions no-op

# ── Catppuccin Mocha theme ────────────────────
# https://github.com/catppuccin/kitty
# Paste the theme file or use the include directive:
#   include ~/.config/kitty/themes/catppuccin-mocha.conf
#
# Inline colours (so the file is self-contained):
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

cursor                  #F5E0DC
cursor_text_color       #1E1E2E

url_color               #F5E0DC

# Window borders
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# Tab bar
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

# Normal colours
color0  #45475A
color1  #F38BA8
color2  #A6E3A1
color3  #F9E2AF
color4  #89B4FA
color5  #F5C2E7
color6  #94E2D5
color7  #BAC2DE

# Bright colours
color8  #585B70
color9  #F38BA8
color10 #A6E3A1
color11 #F9E2AF
color12 #89B4FA
color13 #F5C2E7
color14 #94E2D5
color15 #A6ADC8

# ── SSH kitten (replaces Ghostty's ssh integration) ───
# Allows Kitty graphics, shell integration and sudo forwarding over SSH.
# Usage:  kitty +kitten ssh user@host
# Alias for convenience (add to your shell rc):
#   alias kssh="kitty +kitten ssh"

# ── Word jumps (Option+←/→) in shells kitty did not start, e.g. herdr panes ──
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf
